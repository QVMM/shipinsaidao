services:
  - type: web
    name: tihua-trace
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm rebuild better-sqlite3 && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      - key: OFFLINE_MODE
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: SEAL_SECRET
        generateValue: true
      # MiMo 仅负责语音合成，不参与问答与业务判定。
      - key: MIMO_API_KEY
        sync: false
      - key: MIMO_BASE_URL
        value: https://token-plan-cn.xiaomimimo.com/v1
      - key: MIMO_TTS_VOICE
        value: 茉莉
      # Rotate in Render Dashboard if this blueprint value was ever public.
      # Prefer sync:false + Dashboard secret for long-lived deploys.
      - key: DJTK_STAGE_TOKEN
        sync: false
